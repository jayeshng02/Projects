<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <h1>Tic - Tac - Toe</h1>
    <div id="menu">
        <h3>Choose P1</h3>
        <div id="opt">
        <div id="btnX">X</div>
        <div id="btnO">O</div>
        </div>
    </div>
    <div class="box">
        <div class="l1">
            <div class="btn ro c0 d1"></div>
            <div class="btn r0 c1"></div>
            <div class="btn r0 c2 d2"></div>
        </div>
        <div class="l2">
            <div class="btn r1 c0"></div>
            <div class="btn r1 c1 d1 d2"></div>
            <div class="btn r1 c2"></div>
        </div>
        <div class="l3">
            <div class="btn r2 c0 d2"></div>
            <div class="btn r2 c1"></div>
            <div class="btn r2 c2 d1"></div>
        </div>
    </div>
<script src="app.js"></script>
</body>
</html>
